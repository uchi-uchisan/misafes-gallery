<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>みさフェス フォトギャラリー</title>

<!-- ホーム画面に追加した時、アプリのように全画面で開くための設定 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c97a1f">

<!-- iPhone(Safari)用の設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="みさフェス">
<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-deep: #c97a1f;
    --indigo-mid: #e0942f;
    --gold: #ffffff;
    --gold-deep: #a3801c;
    --heart: #b5624f;
    --khaki: rgba(34,36,42,0.6);
    --paper: #f7f2e6;
    --ink: #22242a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{ background:var(--indigo-deep); }
  body{
    min-height:100vh;
    background:#ffffff;
    font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
    color:var(--ink);
  }

  /* ---------- 暖簾風ヘッダー ---------- */
  .noren{
    position:relative;
    background:var(--gold);
    padding:38px 0 24px;
    text-align:center;
  }
  .noren-fringe{
    height:16px;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
  }
  .noren-fringe span{
    width:16px;
    height:100%;
    background:var(--gold);
    flex-shrink:0;
  }
  .noren-inner{ padding:0 20px; }
  .noren-eyebrow{
    font-family:"RocknRoll One", sans-serif;
    color:var(--indigo-deep);
    font-size:13px;
    letter-spacing:0.35em;
    margin-bottom:10px;
    opacity:0.75;
  }
  .noren h1{
    font-family:"RocknRoll One", sans-serif;
    color:var(--indigo-deep);
    font-size:30px;
    letter-spacing:0.08em;
  }

  .wrap{ max-width:760px; margin:0 auto; padding:0 16px 70px; }
  .sub{
    text-align:center; font-size:12.5px; color:var(--khaki);
    margin:22px 0 24px; line-height:1.8;
  }

  .year-tabs{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .year-tab{
    padding:7px 18px;
    border:1.5px solid var(--indigo-mid);
    color:var(--indigo-mid);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .year-tab.active{
    background:var(--indigo-mid);
    color:#fff;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:14px;
  }
  @media (min-width:520px){
    .grid{ grid-template-columns:repeat(3, 1fr); }
  }
  .card{
    background:var(--paper);
  }
  .card .thumb{
    cursor:pointer; display:block; position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    background-color:#e8d9a8;
    background-image:linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.75) 50%, transparent 70%);
    background-size:250% 100%;
    animation:shimmer 1.3s infinite;
  }
  .card .thumb.loaded{ animation:none; background:none; }
  .card img{
    width:100%; height:100%; object-fit:cover; display:block;
    opacity:0;
    transition:opacity 0.25s;
  }
  .card .thumb.loaded img{ opacity:1; }
  @keyframes shimmer{
    0%{ background-position:150% 0; }
    100%{ background-position:-150% 0; }
  }
  .card .msg{
    font-size:11.5px;
    padding:9px 11px 5px;
    color:var(--ink);
    line-height:1.5;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    border-top:1px solid rgba(34,36,42,0.1);
  }
  .like-row{
    display:flex; align-items:center; gap:6px;
    padding:6px 10px 10px;
  }
  .like-btn{
    display:flex; align-items:center; gap:5px;
    background:transparent;
    border:1.5px solid var(--indigo-mid);
    border-radius:2px;
    padding:4px 11px;
    font-size:12px;
    font-weight:700;
    color:var(--indigo-mid);
    cursor:pointer;
  }
  .like-btn.liked{
    background:var(--indigo-mid);
    color:var(--paper);
  }
  .like-btn .heart{ font-size:12px; }
  .empty{
    text-align:center;
    color:var(--khaki);
    font-size:13px;
    padding:60px 0;
  }

  #lightbox{
    position:fixed; inset:0;
    background:rgba(16,20,35,0.94);
    display:none;
    align-items:center; justify-content:center;
    z-index:50;
    padding:24px;
  }
  #lightbox.active{ display:flex; }
  #lightbox .box{ max-width:640px; width:100%; }
  #lightbox img{ width:100%; border:3px solid var(--gold); display:block; margin-bottom:16px; }
  #lightbox .msg{ color:var(--paper); font-size:15px; line-height:1.8; text-align:center; white-space:pre-wrap; margin-bottom:18px; }
  #lightbox .close-btn{
    display:block; margin:0 auto;
    padding:10px 30px;
    background:transparent;
    border:1.5px solid rgba(247,242,230,0.4);
    color:rgba(247,242,230,0.65);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="noren">
  <div class="noren-inner">
    <div class="noren-eyebrow">みさフェス — 2026.9.26</div>
    <h1>フォトギャラリー</h1>
  </div>
</div>
<div class="noren-fringe"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="wrap">
  <div class="sub">
    投稿していただいた写真の中から、公開OKのものだけをまとめています。<br>
    <span style="font-size:11px; opacity:0.85;">掲載中の写真について、取り下げをご希望の場合は、<a href="mailto:misaoyama.chonaikai@gmail.com" style="color:inherit;">misaoyama.chonaikai@gmail.com</a> までご連絡ください。</span>
  </div>

  <div id="year-tabs" class="year-tabs" style="display:none;"></div>

  <div id="grid" class="grid"></div>
  <div id="empty-msg" class="empty" style="display:none;">まだ公開されている写真はありません</div>
</div>

<div id="lightbox">
  <div class="box">
    <img id="lightbox-img" src="">
    <div class="msg" id="lightbox-msg"></div>
    <button class="close-btn" id="lightbox-close">閉じる</button>
  </div>
</div>

<script>
// ▼ 写真・メッセージ用のApps ScriptのURL(投稿ページと同じもの) ▼
const APPSCRIPT_URL = "https://script.google.com/macros/s/AKfycbzu8iWmrG1pRTN1JBiDFLdvfIDtckPsrRD2fT6vkNHunHJi2Nexo_KIvjveO5r7xP_ixw/exec";

const gridEl = document.getElementById('grid');
const emptyMsg = document.getElementById('empty-msg');
const yearTabs = document.getElementById('year-tabs');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxMsg = document.getElementById('lightbox-msg');
const lightboxClose = document.getElementById('lightbox-close');

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// この端末で「いいね」した写真を覚えておく(同じ端末からの連打防止)
const LIKED_KEY = 'misafes_gallery_liked';
let likedSet = new Set();
try{
  const saved = localStorage.getItem(LIKED_KEY);
  if(saved) likedSet = new Set(JSON.parse(saved));
}catch(err){ likedSet = new Set(); }
function saveLikedSet(){
  try{ localStorage.setItem(LIKED_KEY, JSON.stringify(Array.from(likedSet))); }catch(err){}
}

async function toggleLike(rowTime, btnEl, countEl){
  const alreadyLiked = likedSet.has(rowTime);
  const delta = alreadyLiked ? -1 : 1;

  // 先に見た目だけ即座に反映
  if(alreadyLiked){
    likedSet.delete(rowTime);
    btnEl.classList.remove('liked');
  }else{
    likedSet.add(rowTime);
    btnEl.classList.add('liked');
  }
  saveLikedSet();
  const currentCount = parseInt(countEl.textContent, 10) || 0;
  countEl.textContent = Math.max(0, currentCount + delta);

  try{
    await fetch(APPSCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action: 'toggleLike', rowTime, delta })
    });
  }catch(err){
    // 送信に失敗しても、次回のページ読み込みで実際の数と同期される
  }
}

let allGalleryItems = []; // 全年分の投稿を保持しておく
let selectedYear = null;

function extractYear(timeStr){
  // 投稿日時(例:"Wed Aug 05 2026 06:48:59 GMT+0900")から年を取り出す
  const m = (timeStr || '').match(/\b(20\d{2})\b/);
  if(m) return parseInt(m[1], 10);
  const d = new Date(timeStr);
  return isNaN(d.getFullYear()) ? null : d.getFullYear();
}

function renderYearTabs(){
  const years = Array.from(new Set(allGalleryItems.map(it => extractYear(it.time)).filter(Boolean)))
    .sort((a, b) => b - a); // 新しい年が先
  if(years.length <= 1){
    yearTabs.innerHTML = '';
    yearTabs.style.display = 'none';
    return;
  }
  yearTabs.style.display = 'flex';
  if(!selectedYear || !years.includes(selectedYear)) selectedYear = years[0];
  yearTabs.innerHTML = years.map(y =>
    `<div class="year-tab ${y === selectedYear ? 'active' : ''}" data-year="${y}">${y}年</div>`
  ).join('');
  yearTabs.querySelectorAll('.year-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      selectedYear = parseInt(tab.dataset.year, 10);
      renderYearTabs();
      renderGalleryGrid();
    });
  });
}

function renderGalleryGrid(){
  const items = selectedYear
    ? allGalleryItems.filter(it => extractYear(it.time) === selectedYear)
    : allGalleryItems;

  if(items.length === 0){
    emptyMsg.style.display = 'block';
    emptyMsg.textContent = 'この年の写真はまだありません';
    gridEl.innerHTML = '';
    return;
  }
  emptyMsg.style.display = 'none';
  gridEl.innerHTML = '';
  items.slice().reverse().forEach(item => {
    const isLiked = likedSet.has(item.time);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumb">
        <img src="${item.photoUrl}" loading="lazy">
      </div>
      ${item.message ? `<div class="msg">${escapeHtml(item.message)}</div>` : ''}
      <div class="like-row">
        <div class="like-btn ${isLiked ? 'liked' : ''}">
          <span class="heart">${isLiked ? '❤️' : '🤍'}</span>
          <span class="like-count">${item.likes || 0}</span>
        </div>
      </div>
    `;
    const thumbEl = card.querySelector('.thumb');
    const imgEl = thumbEl.querySelector('img');
    const likeBtn = card.querySelector('.like-btn');
    const countEl = card.querySelector('.like-count');
    if(imgEl.complete && imgEl.naturalWidth > 0){ thumbEl.classList.add('loaded'); }
    else{ imgEl.addEventListener('load', () => thumbEl.classList.add('loaded')); }
    thumbEl.addEventListener('click', () => {
      lightboxImg.src = item.photoUrl;
      lightboxMsg.textContent = item.message || '';
      lightbox.classList.add('active');
    });
    likeBtn.addEventListener('click', () => {
      likeBtn.querySelector('.heart').textContent = likeBtn.classList.contains('liked') ? '🤍' : '❤️';
      toggleLike(item.time, likeBtn, countEl);
    });
    gridEl.appendChild(card);
  });
}

async function loadGallery(){
  try{
    const res = await fetch(APPSCRIPT_URL + '?action=getGalleryApproved', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const items = await res.json();
    allGalleryItems = items;

    if(items.length === 0){
      emptyMsg.textContent = 'まだ公開されている写真はありません';
      emptyMsg.style.display = 'block';
      gridEl.innerHTML = '';
      yearTabs.style.display = 'none';
      return;
    }
    renderYearTabs();
    renderGalleryGrid();
  }catch(err){
    emptyMsg.textContent = '読み込みに失敗しました。しばらくしてから再度お試しください';
    emptyMsg.style.display = 'block';
  }
}

lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
lightbox.addEventListener('click', e => { if(e.target === lightbox) lightbox.classList.remove('active'); });

loadGallery();
</script>
</body>
</html>
